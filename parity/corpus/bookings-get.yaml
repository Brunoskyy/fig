# GET /api/v1/bookings/:id, in shadow mode. The missing-booking case is a
# deliberate fix (Q9) and is listed under `accepted`: parity reports it but
# does not fail on it.
match: GET /api/v1/bookings/:id
setup: |
  INSERT INTO quotes (id, customer_id, origin, dest, container, weight_kg, hazardous, depart, total, breakdown, created_at, expires_at)
  VALUES (1, 2, 'NLRTM', 'USNYC', '20DV', NULL, 0, '2016-11-29', 1431.05, '{"base":"1410.00","fuel":"21.15"}', '2016-11-18 09:12:44', '2016-11-25'),
         (2, NULL, 'CNSHA', 'NLRTM', '40HC', 24000, 1, '2016-12-12', 4903.1, '{"base":"3120.00"}', '2016-11-19 16:40:02', '2016-11-26');
  INSERT INTO bookings (id, quote_id, customer_id, status, created_at, cancelled_at, fee)
  VALUES (1, 1, 2, 'CONFIRMED', '2016-11-18 09:20:13', NULL, NULL),
         (2, 2, NULL, 'CANCELLED', '2016-11-19 16:45:00', '2016-11-20 08:01:59', 1225.78),
         (3, 1, 2, 'CANCELLED', '2016-11-17 10:00:00', '', 0);
cases:
  - name: confirmed booking
    path: /api/v1/bookings/1
  - name: cancelled booking with a fee
    path: /api/v1/bookings/2
  - name: cancelled row with an empty timestamp (legacy data)
    path: /api/v1/bookings/3
  - name: id with trailing junk is parsed like parseInt
    path: /api/v1/bookings/2abc
  - name: missing booking (Q9, fixed on purpose)
    path: /api/v1/bookings/404
  - name: id that is not a number (Q9, fixed on purpose)
    path: /api/v1/bookings/latest
accepted:
  - case: missing booking (Q9, fixed on purpose)
    reason: Q9. The service answers 404 with a structured error; legacy answers 200 {"ok":false}. Kept in shadow until the mobile app reads the status code.
    status: 404
    paths: [status, $.ok, $.err, $.error]
    expect: { $.error.code: NOT_FOUND }
  - case: id that is not a number (Q9, fixed on purpose)
    reason: Q9, same as above.
    status: 404
    paths: [status, $.ok, $.err, $.error]
    expect: { $.error.code: NOT_FOUND }
