# GET /api/v1/ports, the golden route: the first one ported, and the one
# /fig:port points at as the example to follow.
match: GET /api/v1/ports
cases:
  - name: all ports, ordered by name
    path: /api/v1/ports
  - name: region filter
    path: /api/v1/ports?region=EU
  - name: region filter is case-insensitive
    path: /api/v1/ports?region=sa
  - name: unknown region is an empty list, not an error
    path: /api/v1/ports?region=MARS
  - name: empty region means no filter
    path: /api/v1/ports?region=
  - name: JSONP for the old agents portal (Q10)
    path: /api/v1/ports?region=NA&callback=loadPorts
  - name: JSONP callback that is not an identifier is ignored
    path: /api/v1/ports?callback=alert(1)//
  - name: repeated region (Express makes it an array)
    path: /api/v1/ports?region=EU&region=AS
  # Express 4 parses brackets with qs, so these reach the handler as arrays
  # and objects. The service must parse them the same way.
  - name: region with brackets is an array of one
    path: /api/v1/ports?region[]=EU
  - name: region with a key is an object, which matches no region
    path: /api/v1/ports?region[x]=EU
  - name: nested region object
    path: /api/v1/ports?region[a][b]=EU
  - name: JSONP callback with brackets still answers JSONP
    path: /api/v1/ports?callback[]=loadPorts
  - name: repeated JSONP callback is not an identifier, so JSON
    path: /api/v1/ports?callback=a&callback=b
