name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prettier --check .
      - name: Hook dry run
        run: npm run hooks:dry-run
      - name: Parity
        run: npm run parity
      - name: Embedding model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/fig-models
          key: fig-models-bge-small-en-v1.5
      - name: Index eval (downloads the model on a cold cache)
        run: npm run index:eval
        env:
          FIG_ALLOW_DOWNLOAD: '1'
      - name: Tests
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            migration/parity/
            index/eval/runs/
