# Questions a developer porting Quayside would ask, with the lines that
# answer them. Written in the words of the business, not of the code: no
# function names, no route paths, no phrases copied from comments. The
# leakage test in test/index.test.ts enforces the first two.
#
# The `code` set is the other half of real use: questions from someone who
# already saw a name in a log or a stack trace. Leakage is the point there,
# so the test skips it, and the eval reports the two sets separately.
#
# A hit is a retrieved chunk in the same file that overlaps one of the
# ranges. recall@5 is the share of a question's ranges covered in the top 5.
questions:
